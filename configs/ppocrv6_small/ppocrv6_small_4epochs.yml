# Fine-tuning config: 4 epoch(s).
# Derived from configs/ppocrv5_mobile/ppocrv5_mobile_<N>epochs.yml (our PP-OCRv5 setup) with the PP-OCRv6_small_rec
# architecture of PaddleOCR v3.7.0 (configs/rec/PP-OCRv6/PP-OCRv6_small_rec.yml). Data, dictionary, image size,
# batch size, schedule and seed are identical to the PP-OCRv5 runs.
# The 2-epoch and 4-epoch files differ only in Global.epoch_num and output paths.
Global:
  model_name: PP-OCRv6_small_rec # To use static model for inference.
  debug: false
  use_gpu: true
  seed: 42
  epoch_num: 4
  log_smooth_window: 20
  print_batch_step: 100
  save_model_dir: /kaggle/working/output/ppocrv6_small_4epochs
  save_epoch_step: 1
  eval_batch_step: [0, 1000]
  cal_metric_during_train: true
  pretrained_model: /kaggle/working/pretrained/PP-OCRv6_small_rec_pretrained.pdparams
  checkpoints:
  save_inference_dir:
  use_visualdl: false
  infer_img:
  character_dict_path: /kaggle/input/datasets/baonguyenngoc0902/hcmus-nlp-vietnamese-recognition-resources/vi_dict.txt
  infer_mode: false
  use_space_char: true
  distributed: true
  save_res_path: /kaggle/working/output/ppocrv6_small_4epochs/predicts.txt
  d2s_train_image_shape: [3, 48, 960]

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0005
    warmup_epoch: 0.5
  regularizer:
    name: L2
    factor: 3.0e-05

Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform:
  Backbone:
    name: PPLCNetV4
    model_size: small
  Head:
    name: MultiHead
    head_list:
      - CTCHead:
          Neck:
            name: lightsvtr
            dims: 120
            depth: 2
            mlp_ratio: 2.0
            local_kernel: 7
          Head:
            fc_decay: 0.00001
      - NRTRHead:
          nrtr_dim: 384
          max_text_length: 100

Loss:
  name: MultiLoss
  loss_config_list:
    - CTCLoss:
    - NRTRLoss:

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc
  ignore_space: False

Train:
  dataset:
    name: MultiScaleDataSet
    ds_width: false
    data_dir: /kaggle/input/datasets/baonguyenngoc0902/hcmus-nlp-vietnamese-recognition-resources/vi_rec_100k
    ext_op_transform_idx: 1
    label_file_list:
    - /kaggle/input/datasets/baonguyenngoc0902/hcmus-nlp-vietnamese-recognition-resources/vi_rec_100k/rec_train.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - RecConAug:
          prob: 0.5
          ext_data_num: 2
          image_shape: [48, 960, 3]
          max_text_length: 100
      - RecAug:
      - MultiLabelEncode:
          max_text_length: 100
          gtc_encode: NRTRLabelEncode
      - KeepKeys:
          keep_keys:
          - image
          - label_ctc
          - label_gtc
          - length
          - valid_ratio
  sampler:
    name: MultiScaleSampler
    scales: [[960, 32], [960, 48], [960, 64]]
    first_bs: &bs 24
    fix_bs: false
    divided_factor: [8, 16] # w, h
    is_training: True
  loader:
    shuffle: true
    batch_size_per_card: *bs
    drop_last: true
    num_workers: 4
Eval:
  dataset:
    name: SimpleDataSet
    data_dir: /kaggle/input/datasets/baonguyenngoc0902/hcmus-nlp-vietnamese-recognition-resources/vi_rec_100k
    label_file_list:
    - /kaggle/input/datasets/baonguyenngoc0902/hcmus-nlp-vietnamese-recognition-resources/vi_rec_100k/rec_val.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - MultiLabelEncode:
          max_text_length: 1000
          gtc_encode: NRTRLabelEncode
      - RecResizeImg:
          eval_mode: True
          image_shape: [3, 48, 960]
      - KeepKeys:
          keep_keys:
          - image
          - label_ctc
          - label_gtc
          - length
          - valid_ratio
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 1
    num_workers: 4
